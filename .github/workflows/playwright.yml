name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # The config needs an environment with a baseURL; only staging has one so far.
      # Override with the TEST_ENV / BASE_URL repository variables.
      TEST_ENV: ${{ vars.TEST_ENV || 'staging' }}
      BASE_URL: ${{ vars.BASE_URL }}
      # Dev Root credentials are read from a local .env only (never from CI variables),
      # so specs that need them are skipped here.
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
